name: Build LAUR&DOR APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev
      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install "Cython==0.29.36" "setuptools<70"
          python -m pip install "buildozer==1.5.0"
          python -m pip install "kivy==2.3.0" "kivymd==2.0.0"
       

      - name: Clean everything
        run: |
          rm -rf .buildozer
          rm -rf bin
    
      - name: Vérifier Cython
        run: |
          cython --version
          python -c "import Cython; print(Cython.__version__)"

      - name: Verify Android Firebase configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path(".")
          gs = root / "google-services.json"
          if not gs.exists():
              raise SystemExit("Missing google-services.json at repository root")
          data = json.loads(gs.read_text(encoding="utf-8"))
          pkg = data["client"][0]["client_info"]["android_client_info"]["package_name"]
          if pkg != "com.resto.app":
              raise SystemExit(f"Firebase package mismatch: expected com.resto.app, got {pkg}")
          service = root / "android_src/com/resto/app/MyFirebaseMessagingService.java"
          if not service.exists():
              raise SystemExit("Missing Firebase messaging service Java class for com.resto.app")
          manifest = root / "android_src/firebase_manifest.xml"
          manifest_text = manifest.read_text(encoding="utf-8")
          if "com.resto.app.MyFirebaseMessagingService" not in manifest_text:
              raise SystemExit("Firebase manifest does not reference com.resto.app.MyFirebaseMessagingService")
          print(f"Firebase package OK: {pkg}")
          print("Android Firebase service OK")
          PY

      - name: Restore signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" \
            | base64 --decode > "$RUNNER_TEMP/laur-dor-upload.keystore"
          chmod 600 "$RUNNER_TEMP/laur-dor-upload.keystore"

      - name: Build signed release APK
        env:
          P4A_RELEASE_KEYSTORE: ${{ runner.temp }}/laur-dor-upload.keystore
          P4A_RELEASE_KEYSTORE_PASSWD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          P4A_RELEASE_KEYALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          P4A_RELEASE_KEYALIAS_PASSWD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          buildozer -v android release --debug

      - name: Upload signed release APK
        uses: actions/upload-artifact@v4
        with:
          name: LAUR-DOR-Android-Release-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/laur-dor-upload.keystore"